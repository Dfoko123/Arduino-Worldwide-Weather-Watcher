; =====================================================================
;  Worldwide Weather Watcher - version ARDUINO UNO
; =====================================================================

[env:uno]
platform = atmelavr
board = uno
framework = arduino

; Vitesse de la console serie (Serial Monitor) : doit etre la meme
; que Serial.begin(115200) dans le code.
monitor_speed = 115200

; Rend le dossier include/ (board_pins.h, cesi_types.h) visible
; aussi par les outils du dossier lib/cesi_grove/.
build_flags = -I include

; Bibliotheques telechargees automatiquement par PlatformIO.
; (Wire, SPI, EEPROM et SoftwareSerial sont deja fournies avec l'Arduino.
;  Le capteur BME280 utilise notre propre driver : aucune bibliotheque a ajouter.)
lib_deps =
    arduino-libraries/SD@^1.2.4